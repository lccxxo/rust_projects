[package]
name = "web_skeleton"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web 框架 + 异步运行时
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }

# HTTP 中间件（日志追踪、CORS、超时、请求体限制、请求 ID）
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "timeout", "limit", "request-id"] }

# 结构化日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 序列化 / 反序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 错误处理
thiserror = "2"
anyhow = "1"

# 请求参数校验
validator = { version = "0.20", features = ["derive"] }

# 配置加载（环境变量 + .env 文件）
dotenvy = "0.15"

# 工具
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
